name: Board visual tiles and historical filter QA
on:
  push:
    branches: [board-visual-comparison-tiles-20261027]
permissions:
  contents: read
jobs:
  visual-tiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Board modules and safeguard all other demo roles
        run: |
          node --check src/board-comparison-tiles.mjs
          node --check src/board-map-data.mjs
          node --check src/board-map-view.mjs
          node --check src/board-dp-view.mjs
          node --check src/board-map-links.mjs
          node --check src/student-experience-app.mjs
          node --test tests/board-comparison-tiles.test.mjs tests/board-map.test.mjs tests/board-overview.test.mjs tests/board-dp.test.mjs tests/student-experience.test.mjs tests/data.test.mjs tests/faculty-map-growth.test.mjs tests/learner-tags.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser QA
        run: python -m pip install playwright==1.57.0
      - name: Exercise real comparison tiles and Diploma filters
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/board-visual-tiles.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          export MYLEARNERS_URL=http://127.0.0.1:8765
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python tests/e2e/board_visual_tiles_qa.py
      - name: Preserve screenshots and browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-visual-tiles
          path: qa-board-visual-tiles/
          retention-days: 14
          if-no-files-found: warn
