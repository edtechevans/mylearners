name: Validate and deploy My Learners demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fictional data model and transparent indicators
        run: node --test tests/data.test.mjs tests/faculty-map-growth.test.mjs tests/learner-tags.test.mjs tests/student-experience.test.mjs tests/academic-journey.test.mjs tests/faculty-student-daily.test.mjs tests/leader-summary.test.mjs tests/sss-demo.test.mjs tests/sitewide-ui.test.mjs tests/board-map.test.mjs tests/board-overview.test.mjs tests/board-dp.test.mjs tests/board-comparison-tiles.test.mjs
      - name: Validate entry point and Javascript syntax
        run: |
          node --check src/student-experience-app.mjs
          node --check tests/sitewide-ui.test.mjs
          grep -q 'sitewide-polish.css' index.html
          node --check src/leader-summary.mjs
          node --check src/sss-demo-data.mjs
          node --check src/sss-view.mjs
          node --check src/experience-data.mjs
          node --check src/academic-journey-data.mjs
          node --check src/academic-journey-view.mjs
          node --check src/student-daily-overview.mjs
          node --check src/board-map-data.mjs
          node --check src/board-map-history.mjs
          node --check src/board-map-view.mjs
          node --check src/board-comparison-tiles.mjs
          node --check src/board-map-overview.mjs
          node --check src/board-map-links.mjs
          node --check src/board-dp-data.mjs
          node --check src/board-dp-view.mjs
          grep -q 'student-experience-app.mjs' index.html
      - name: Browser rendering and role toggle smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mylearners-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo 'No Chromium system browser'; exit 1; fi
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --window-size=1440,900 --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8765/ > /tmp/mylearners-dom.html 2>/tmp/mylearners-chrome.log
          grep -q 'roster-daily' /tmp/mylearners-dom.html
          grep -q 'Search for a student across all assigned classes' /tmp/mylearners-dom.html
          grep -q 'data-role="student"' /tmp/mylearners-dom.html
          grep -q 'aria-label="Dashboard views"' /tmp/mylearners-dom.html
          grep -q 'data-skip-main' /tmp/mylearners-dom.html
          grep -q '<nav class="roles"' /tmp/mylearners-dom.html
          grep -q 'data-role="leader"' /tmp/mylearners-dom.html
          grep -q 'How is this calculated' /tmp/mylearners-dom.html
          grep -q 'academic-class-compact' /tmp/mylearners-dom.html
          grep -q 'academic-class-breakdown' /tmp/mylearners-dom.html
          grep -q 'data-academic-mode="report"' /tmp/mylearners-dom.html
          grep -q 'data-academic-subject' /tmp/mylearners-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/student' > /tmp/mylearners-student-academic-dom.html 2>/tmp/mylearners-student-academic-chrome.log
          grep -q 'student-landing' /tmp/mylearners-student-academic-dom.html
          grep -q 'student-detail-section' /tmp/mylearners-student-academic-dom.html
          grep -q 'data-action="save-reflection"' /tmp/mylearners-student-academic-dom.html
          grep -q 'academic-profile' /tmp/mylearners-student-academic-dom.html
          grep -q 'data-select="student-grade"' /tmp/mylearners-student-academic-dom.html
          grep -q 'My school reports' /tmp/mylearners-student-academic-dom.html
          grep -q 'IXL Mathematics' /tmp/mylearners-student-academic-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/leader' > /tmp/mylearners-leader-dom.html 2>/tmp/mylearners-chrome-leader.log
          grep -q 'leader-learning-grid' /tmp/mylearners-leader-dom.html
          grep -q 'Open Leaders dashboard' /tmp/mylearners-leader-dom.html
          grep -q 'MAP Mathematics growth' /tmp/mylearners-leader-dom.html
          grep -q 'MAP Reading growth' /tmp/mylearners-leader-dom.html
          grep -q 'Report card coverage' /tmp/mylearners-leader-dom.html
          grep -q 'leader-evidence-strip' /tmp/mylearners-leader-dom.html
          grep -q 'data-leader-panel="academics"' /tmp/mylearners-leader-dom.html
          grep -q 'data-leader-panel="patterns"' /tmp/mylearners-leader-dom.html
          grep -q 'Core Phonics' /tmp/mylearners-leader-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/sss' > /tmp/mylearners-sss-dom.html 2>/tmp/mylearners-chrome-sss.log
          grep -q 'data-role="sss"' /tmp/mylearners-sss-dom.html
          grep -q 'Open Student Support Services (SSS) demonstration dashboard' /tmp/mylearners-sss-dom.html
          grep -q 'Student Support Services' /tmp/mylearners-sss-dom.html
          grep -q 'data-select="sss-grade"' /tmp/mylearners-sss-dom.html
          grep -q 'data-sss-student=' /tmp/mylearners-sss-dom.html
          grep -q 'WIDA Screener' /tmp/mylearners-sss-dom.html
          grep -q 'SSS learners' /tmp/mylearners-sss-dom.html
          grep -q 'Prototype, not an authorised SSS system' /tmp/mylearners-sss-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board' > /tmp/mylearners-board-dom.html 2>/tmp/mylearners-chrome-board.log
          grep -q 'board-view' /tmp/mylearners-board-dom.html
          grep -q 'AISG AGGREGATED DATA' /tmp/mylearners-board-dom.html
          grep -q 'board-strength-grid' /tmp/mylearners-board-dom.html
          grep -q 'OUR LEARNING STORY' /tmp/mylearners-board-dom.html
          grep -q 'board-story-insight' /tmp/mylearners-board-dom.html
          grep -q 'data-board-overview-chart="dp"' /tmp/mylearners-board-dom.html
          grep -q 'board-trend-svg' /tmp/mylearners-board-dom.html
          grep -q 'data-board-view="explore"' /tmp/mylearners-board-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board?view=explore&window=spring2026&subject=math&division=all&grade=all' > /tmp/mylearners-board-explore-dom.html 2>/tmp/mylearners-explore-chrome.log
          grep -q 'board-controls' /tmp/mylearners-board-explore-dom.html
          grep -q 'How does AISG compare?' /tmp/mylearners-board-explore-dom.html
          grep -q 'board-choose-prompt' /tmp/mylearners-board-explore-dom.html
          grep -q 'board-comparison-subjects' /tmp/mylearners-board-explore-dom.html
          grep -q 'board-comparison-display' /tmp/mylearners-board-explore-dom.html
          grep -q 'vs regional schools' /tmp/mylearners-board-explore-dom.html
          grep -q '>MAP</button>' /tmp/mylearners-board-explore-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board?view=dp&metric=average' > /tmp/mylearners-board-dp-dom.html 2>/tmp/mylearners-dp-chrome.log
          grep -q 'IB Diploma results' /tmp/mylearners-board-dp-dom.html
          grep -q 'board-dp-graphic-grid' /tmp/mylearners-board-dp-dom.html
          grep -q 'data-board-dp-select="year"' /tmp/mylearners-board-dp-dom.html
          grep -q 'board-dp-graphic-consistency' /tmp/mylearners-board-dp-dom.html
          grep -q 'board-chart-range-annotation' /tmp/mylearners-board-dp-dom.html
          if grep -q 'data-board-dp-select="range"' /tmp/mylearners-board-dp-dom.html; then echo "Diploma range filter not simplified"; exit 1; fi
          grep -q 'data-board-dp-point="average:2026"' /tmp/mylearners-board-dp-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board?view=explore&window=fall2026&subject=math' > /tmp/mylearners-board-fall-dom.html 2>/tmp/mylearners-fall-chrome.log
          grep -q 'board-availability-note' /tmp/mylearners-board-fall-dom.html
          grep -q 'board-no-regional' /tmp/mylearners-board-fall-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board?view=explore&window=fall2026&subject=math&details=1' > /tmp/mylearners-board-drawer-dom.html 2>/tmp/mylearners-drawer-chrome.log
          grep -q 'board-map-drawer' /tmp/mylearners-board-drawer-dom.html
          grep -q 'aria-modal="true"' /tmp/mylearners-board-drawer-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board?view=overview&chart=dp&metric=average' > /tmp/mylearners-board-story-dom.html 2>/tmp/mylearners-story-chrome.log
          grep -q 'board-strength-grid' /tmp/mylearners-board-story-dom.html
          grep -q 'board-dp-overview-trend' /tmp/mylearners-board-story-dom.html
          if grep -Eiq '\.xlsx|\.csv|\.pdf|KPIs!|Dashboard SY[0-9]|Source:' /tmp/mylearners-board-story-dom.html; then echo 'Board displayed restricted document details'; exit 1; fi
      - name: Full desktop Chrome screenshot and usability walkthrough
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mylearners-visual-server.log 2>&1 &
          server_pid=$!
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo 'Chrome not available'; exit 1; fi
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --no-first-run --remote-allow-origins='*' --remote-debugging-port=9229 --user-data-dir=/tmp/mylearners-clarity-chrome about:blank >/tmp/mylearners-visual-chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill "$server_pid" "$chrome_pid" 2>/dev/null || true' EXIT
          node --check tests/e2e/clarity-walkthrough.mjs
          node tests/e2e/clarity-walkthrough.mjs
      - name: Preserve rendered Chrome screenshots and QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clarity-chrome-walkthrough
          path: qa-artifacts/
          if-no-files-found: warn
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
