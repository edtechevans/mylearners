name: Validate and deploy My Learners demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify fictional data model and transparent indicators
        run: node --test tests/data.test.mjs tests/faculty-map-growth.test.mjs tests/learner-tags.test.mjs tests/student-experience.test.mjs tests/board-map.test.mjs
      - name: Validate entry point and Javascript syntax
        run: |
          node --check src/student-experience-app.mjs
          node --check src/experience-data.mjs
          node --check src/board-map-data.mjs
          node --check src/board-map-history.mjs
          node --check src/board-map-view.mjs
          grep -q 'student-experience-app.mjs' index.html
      - name: Browser rendering and role toggle smoke test
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mylearners-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$browser" ]; then echo 'No Chromium system browser'; exit 1; fi
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom http://127.0.0.1:8765/ > /tmp/mylearners-dom.html 2>/tmp/mylearners-chrome.log
          grep -q 'Your students, in one place' /tmp/mylearners-dom.html
          grep -q 'data-role="student"' /tmp/mylearners-dom.html
          grep -q 'data-role="leader"' /tmp/mylearners-dom.html
          grep -q 'How is this calculated' /tmp/mylearners-dom.html
          timeout 45s "$browser" --headless=new --disable-dev-shm-usage --no-sandbox --disable-gpu --virtual-time-budget=6000 --dump-dom 'http://127.0.0.1:8765/#/board' > /tmp/mylearners-board-dom.html 2>/tmp/mylearners-chrome-board.log
          grep -q 'board-view' /tmp/mylearners-board-dom.html
          grep -q 'AISG AGGREGATED DATA' /tmp/mylearners-board-dom.html
          grep -q 'data-board-select="year"' /tmp/mylearners-board-dom.html
          grep -q 'data-board-window="unavailable-spring"' /tmp/mylearners-board-dom.html
          grep -q 'Grade 10' /tmp/mylearners-board-dom.html
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
