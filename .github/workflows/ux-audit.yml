name: Teacher UX audit (review branch)
on:
  push:
    branches: [qa-teacher-usability-20261027]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: python -m pip install playwright==1.57.0
      - name: Classroom-teacher journey and responsive audit
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/mylearners-ux-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          export MYLEARNERS_URL=http://127.0.0.1:8765
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python tests/e2e/faculty_ux_audit.py
      - name: Save screenshots and audit findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-ux-audit
          path: ux-audit/
          if-no-files-found: warn
          retention-days: 14
