name: My Learners - UI and data-regression checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check src/daily-ux-core.mjs
          node --check src/daily-ux.mjs
          node --check src/student-experience-app.mjs
      - name: Run app regression tests
        run: node --test tests/*.test.mjs
      - name: Run real Chrome Faculty class consistency checks
        shell: bash
        timeout-minutes: 8
        run: |
          set -euo pipefail
          node --check tests/e2e/faculty-layout-consistency.mjs
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/faculty-consistency-http.log 2>&1 &
          server=$!
          browser="$(command -v google-chrome || command -v chromium)"
          "$browser" --headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu \
            --remote-allow-origins='*' --remote-debugging-port=9239 \
            --user-data-dir=/tmp/mylearners-faculty-consistency about:blank \
            >/tmp/faculty-consistency-chrome.log 2>&1 &
          chrome=$!
          trap 'kill "$server" "$chrome" 2>/dev/null || true' EXIT
          export CHROME_DEBUG_URL=http://127.0.0.1:9239
          node tests/e2e/faculty-layout-consistency.mjs
      - name: Upload Faculty class screenshots and consistency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faculty-class-consistency
          path: |
            qa-artifacts/faculty-consistency-*.png
            qa-artifacts/faculty-consistency-report.json
          retention-days: 14
          if-no-files-found: warn
