name: Faculty and Student Academic Journey QA
on:
  push:
    branches: [faculty-student-academic-journey-20261027]
permissions:
  contents: read
jobs:
  academic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate fictional records and role-safe UI
        run: |
          node --check src/academic-journey-data.mjs
          node --check src/academic-journey-view.mjs
          node --check src/student-experience-app.mjs
          node --test tests/academic-journey.test.mjs tests/data.test.mjs tests/faculty-map-growth.test.mjs tests/learner-tags.test.mjs tests/student-experience.test.mjs tests/board-map.test.mjs tests/board-overview.test.mjs tests/board-dp.test.mjs tests/board-comparison-tiles.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome automation
        run: python -m pip install playwright==1.57.0
      - name: Audit Faculty and Student functionality and Chrome layouts
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/academic-journey-http.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          export MYLEARNERS_URL=http://127.0.0.1:8765
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python tests/e2e/academic_journey_qa.py
      - name: Save browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faculty-student-academic-journey-chrome
          path: qa-academic-journey/
          retention-days: 14
          if-no-files-found: warn
