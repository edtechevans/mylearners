name: Board learning story and confidentiality QA
on:
  push:
    branches: [board-learning-story-20261027]
permissions:
  contents: read
jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JS modules and Board-only data logic
        run: |
          node --check src/board-map-overview.mjs
          node --check src/board-dp-view.mjs
          node --check src/board-dp-data.mjs
          node --check src/board-map-view.mjs
          node --check src/board-map-data.mjs
          node --check src/board-map-links.mjs
          node --check src/student-experience-app.mjs
          node --test tests/board-overview.test.mjs tests/board-dp.test.mjs tests/board-map.test.mjs tests/student-experience.test.mjs tests/data.test.mjs tests/faculty-map-growth.test.mjs tests/learner-tags.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare browser QA
        run: python -m pip install playwright==1.57.0
      - name: Test Board Overview, interactive histories and confidential document labels
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/board-story.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 2
          export MYLEARNERS_URL=http://127.0.0.1:8765
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python tests/e2e/board_story_ux.py
      - name: Save screenshots and QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-learning-story-qa
          path: qa-board-story/
          retention-days: 14
          if-no-files-found: warn
