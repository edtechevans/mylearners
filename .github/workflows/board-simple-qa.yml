name: Board Chrome-first simplification QA
on:
  push:
    branches: [board-simpler-chrome-20261027]
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate simplified Board source and aggregate evidence
        run: |
          node --check src/student-experience-app.mjs
          node --check src/board-map-view.mjs
          node --check src/board-map-overview.mjs
          node --check src/board-map-links.mjs
          node --check src/board-comparison-tiles.mjs
          node --check src/board-dp-view.mjs
          node --test tests/board-map.test.mjs tests/board-dp.test.mjs tests/board-overview.test.mjs tests/board-comparison-tiles.test.mjs tests/data.test.mjs tests/learner-tags.test.mjs tests/faculty-map-growth.test.mjs tests/student-experience.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Chrome browser automation
        run: python -m pip install playwright==1.57.0
      - name: Run Chrome-first Board usability and role-isolation tests
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/board-simple-web.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          sleep 2
          export MYLEARNERS_URL=http://127.0.0.1:8765
          export CHROME_BIN="$(command -v google-chrome || command -v chromium)"
          python tests/e2e/board_simple_qa.py
      - name: Preserve desktop screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: board-chrome-simple-qa
          path: qa-board-simple/
          retention-days: 14
          if-no-files-found: warn
